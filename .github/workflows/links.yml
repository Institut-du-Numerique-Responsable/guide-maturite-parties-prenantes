name: Vérifier les liens

# Le guide cite de nombreuses ressources externes (réglementation, référentiels,
# études). Une vérification mensuelle ouvre une issue si des liens sont morts.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Les téléchargements (PDF, Excel…) n'existent qu'une fois le site construit.
          args: --no-progress --max-retries 2 --accept 200,206,403,429 --exclude 'assets/downloads' 'docs/**/*.md' README.md
          fail: false
      # Réutilise l'issue ouverte s'il en existe une, au lieu d'en créer une par mois.
      - id: existing
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title Liens cassés détectés" --json number --jq '.[0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Liens cassés détectés dans le guide"
          issue-number: ${{ steps.existing.outputs.number }}
          content-filepath: ./lychee/out.md
          labels: documentation
