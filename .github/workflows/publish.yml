name: Construire et publier

# Une seule chaîne : contrôle de la grille, données ouvertes, Excel, PDF et site.
# Sur une pull request : construction et vérification uniquement (artefacts
# téléchargeables pour relecture). Sur main : déploiement sur GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # Une PR mise à jour annule son build précédent ; un déploiement de main va à son terme.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PANDOC_VERSION: "3.12.1"
  TYPST_VERSION: "0.15.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Vérifier la cohérence de la grille
        run: python scripts/guide.py check

      - name: Installer pandoc et Typst
        run: |
          curl -fsSL -o pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i pandoc.deb
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          pandoc --version | head -1 && typst --version

      - name: Générer données, Excel et PDF
        run: |
          python scripts/guide.py json docs/assets/downloads
          python scripts/build_xlsx.py docs/assets/downloads
          python scripts/build_pdf.py docs/assets/downloads
          python scripts/build_llms.py docs

      - name: Construire le site (strict)
        run: |
          mkdocs build --strict
          cp CITATION.cff site/

      - name: Conserver les livrables (relecture)
        uses: actions/upload-artifact@v4
        with:
          name: livrables
          path: docs/assets/downloads/
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
